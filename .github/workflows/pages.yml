name: Publish skate3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Copy and verify the public game
        run: python3 build-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
